<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07121c">
<meta name="description" content="MECH ARENA — AX-01。スマートフォン縦画面向けWebGL戦闘トライアル。">
<title>MECH ARENA / AX-01 — PORTRAIT TRIAL</title>
<style>
  :root { color-scheme: dark; font-family: system-ui,-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif }
  * { box-sizing: border-box }
  html,body { margin:0; width:100%; min-height:100%; background:#060e17 }
  body { height:100dvh; height:100svh; overflow:hidden; overscroll-behavior:none; display:flex; align-items:center; justify-content:center }
  #frame { position:relative; height:100%; width:100%; max-width: min(100vw,56.25svh); aspect-ratio:9/16; overflow:hidden; background:linear-gradient(145deg,#0c2430,#061019); box-shadow:0 0 70px #030810 }
  #game { display:block; width:100%; height:100%; background:#061019; outline:none; touch-action:none; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none }
  #loading { position:absolute; z-index:8; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:17px; background:linear-gradient(160deg,#0b2632,#08121e); padding:28px; text-align:center; }
  #loading .eyebrow { font-size:11px; letter-spacing:.35em; color:#91e8ef; }
  #loading h1 { font-size:clamp(24px,6.5vw,37px); letter-spacing:.15em; margin:5px 0 0; color:#e9fafb; }
  #loading p { max-width:290px; font-size:12px; color:#90aebb; line-height:1.7 }
  #meter { width:min(280px,85%); height:3px; background:#315365; border-radius:2px; overflow:hidden; margin-top:15px }
  #bar { height:100%; width:0%; background:#69dcea; transition:width .15s; }
  #status { font-size:12px; color:#8aacb7; min-height:20px; }
  #landscape { position:absolute; z-index:9; inset:0; background:#05121c; display:none; align-items:center; justify-content:center; padding:24px; text-align:center; color:#c5e8ed }
  #frame button { border:1px solid #69dcea; background:#143843; color:#e6f9fc; border-radius:3px; padding:11px 22px; font-size:14px; cursor:pointer }
  .hidden { display:none!important; }
  @media (orientation:landscape) and (max-height:550px) { #landscape { display:flex } }
  @media (min-width:780px) { #frame { border-left:1px solid #183846; border-right:1px solid #183846 } }
</style>
</head>
<body>
<div id="frame">
  <canvas id="game" aria-label="MECH ARENA 3D gameplay" tabindex="0"></canvas>
  <div id="loading" aria-live="polite">
    <div class="eyebrow">SYSTEM / AX-01</div>
    <h1>MECH ARENA</h1>
    <p>VERTICAL COMBAT TRIAL<br>左右移動で敵を避け、FIREで攻撃。BOOSTで加速。</p>
    <div id="meter"><div id="bar"></div></div>
    <span id="status">3D ENGINE STARTING...</span>
    <button id="retry" class="hidden" type="button" onclick="location.reload()">再読み込み</button>
  </div>
  <div id="landscape">縦画面でプレイしてください。<br>スマートフォンを縦向きにしてください。</div>
</div>
<script>
"use strict";
const assets = {"loader": "mech-arena-pages.loader.js", "data": "mech-arena-pages.data", "framework": "mech-arena-pages.framework.js", "wasm": "mech-arena-pages.wasm"};
const canvas = document.getElementById("game");
const status = document.getElementById("status");
const progressBar = document.getElementById("bar");
const loading = document.getElementById("loading");
const retry = document.getElementById("retry");
const frame = document.getElementById("frame");
const base = "Build/";
const config = {
  dataUrl:base + assets.data,
  frameworkUrl:base + assets.framework,
  codeUrl:base + assets.wasm,
  streamingAssetsUrl:"StreamingAssets",
  companyName:"kikutadev",
  productName:"MECH ARENA — TRIAL",
  productVersion:"0.1",
  devicePixelRatio:Math.min(window.devicePixelRatio || 1, 1.5),
  matchWebGLToCanvasSize:true
};
function fail(err) {
  status.textContent = "起動に失敗しました: " + (err && err.message ? err.message : String(err));
  retry.classList.remove("hidden");
}
if (!document.createElement("canvas").getContext("webgl2")) {
  fail(new Error("このブラウザではWebGL2を使用できません"));
} else {
  const loader = document.createElement("script");
  loader.src = base + assets.loader;
  loader.onerror = () => fail(new Error("Unity loaderを取得できません"));
  loader.onload = () => {
    status.textContent = "機体とステージを読み込み中...";
    createUnityInstance(canvas, config, fraction => {
      progressBar.style.width = Math.round(Math.max(0,Math.min(1,fraction))*100) + "%";
    }).then(() => {
      loading.classList.add("hidden");
      canvas.focus({preventScroll:true});
    }).catch(fail);
  };
  document.body.appendChild(loader);
}
// Touch gestures belong to the game canvas only, not text/navigation controls.
for (const eventType of ["touchmove","touchstart","touchend","touchcancel"]) {
  canvas.addEventListener(eventType, evt => {
    if (evt.cancelable) evt.preventDefault();
  }, {passive:false});
}
canvas.addEventListener("contextmenu", evt => evt.preventDefault());
frame.addEventListener("gesturestart",evt => { if (evt.cancelable) evt.preventDefault(); },{passive:false});
document.addEventListener("visibilitychange",() => { if (document.hidden) canvas.blur(); });
</script>
</body>
</html>
